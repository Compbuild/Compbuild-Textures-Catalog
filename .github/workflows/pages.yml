name: Deploy catalog to GitHub Pages

# Pages is currently set to "Deploy from a branch" in the repo settings, so
# GitHub's built-in pages-build-deployment workflow publishes the site on every
# push and this workflow is manual-only. If the Pages source is ever switched
# to "GitHub Actions", re-add a push trigger here.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
